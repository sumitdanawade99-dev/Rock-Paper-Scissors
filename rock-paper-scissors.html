<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors</title>
<style>
  :root{
    --blue:#2338D8; --blue-dark:#1A2AA8; --ink:#10132B; --chalk:#F2F4FF;
    --sun:#FFD23F; --pink:#FF5C8A; --mint:#3DDC97; --line:#C9D0FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--blue); color:var(--ink);
    font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    line-height:1.4; -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  h1{color:var(--chalk);font-size:1.35rem;letter-spacing:.2px}
  nav{display:flex;gap:6px;background:var(--blue-dark);padding:4px;border-radius:999px}
  nav button{
    border:0;background:transparent;color:var(--chalk);font:inherit;font-size:.9rem;
    padding:8px 16px;border-radius:999px;cursor:pointer
  }
  nav button[aria-current="true"]{background:var(--sun);color:var(--ink);font-weight:700}
  .card{background:var(--chalk);border-radius:22px;padding:20px;margin-bottom:14px}
  h2{font-size:1.15rem;margin-bottom:12px}
  .group{margin-bottom:18px}
  .group > p{font-size:.95rem;font-weight:700;margin-bottom:8px}
  .hint{font-weight:400;font-size:.85rem;color:#4A4F78;margin-top:6px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{
    border:2.5px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;
    padding:12px 6px;border-radius:14px;cursor:pointer
  }
  .opt[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
  .btn{
    display:block;width:100%;border:0;font:inherit;font-weight:800;font-size:1.05rem;
    padding:15px;border-radius:16px;cursor:pointer;background:var(--sun);color:var(--ink);
    box-shadow:0 5px 0 var(--ink);margin-top:6px
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .btn.alt{background:#fff;border:2.5px solid var(--ink);box-shadow:none}
  .btn.alt:active{transform:none;background:var(--line)}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

  .scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
  .score{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 4px}
  .score b{display:block;font-size:2rem;line-height:1.1}
  .score span{font-size:.85rem;color:#4A4F78}
  .score.you{background:var(--mint)} .score.cpu{background:var(--pink)}
  .score.you span,.score.cpu span{color:var(--ink)}
  .roundline{display:flex;justify-content:space-between;font-size:.9rem;margin:14px 2px 0;font-weight:700}

  .arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:16px 0 4px;text-align:center}
  .hand{font-size:4.2rem;line-height:1;min-height:4.4rem;display:flex;align-items:center;justify-content:center}
  .hand small{display:block;font-size:.8rem;font-weight:700;margin-top:4px}
  .vs{font-weight:800;color:#4A4F78}
  .shake{animation:shake .5s ease-in-out}
  @keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(4px)}75%{transform:translateY(-8px)}}
  .verdict{text-align:center;font-weight:800;font-size:1.2rem;min-height:1.8rem;margin-bottom:12px}
  .moves{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .move{
    border:2.5px solid var(--ink);background:#fff;border-radius:18px;padding:14px 4px 10px;
    font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink)
  }
  .move .e{display:block;font-size:2.6rem;line-height:1.1}
  .move:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .move:disabled{opacity:.55;cursor:default}

  .log{list-style:none;display:flex;flex-direction:column;gap:6px}
  .log li{
    display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    background:#fff;border-radius:12px;padding:8px 12px;font-size:.92rem
  }
  .tag{font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:999px;color:var(--ink)}
  .tag.win{background:var(--mint)} .tag.lose{background:var(--pink)} .tag.draw{background:var(--sun)}
  .empty{color:#4A4F78;font-size:.95rem}
  .big{font-size:1.7rem;font-weight:800;text-align:center;margin-bottom:4px}
  .final{text-align:center;font-size:1rem;margin-bottom:16px;color:#4A4F78}
  .match{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .match small{color:#4A4F78;display:block}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;text-align:center}
  .totals div{background:#fff;border-radius:14px;padding:10px 4px}
  .totals b{display:block;font-size:1.4rem}
  .totals span{font-size:.8rem;color:#4A4F78}
  .link{background:none;border:0;font:inherit;color:var(--blue-dark);text-decoration:underline;cursor:pointer;margin-top:12px;padding:4px}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion: reduce){.shake{animation:none}.btn:active,.move:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Rock Paper Scissors</h1>
    <nav aria-label="Sections">
      <button id="tabPlay" aria-current="true">Play</button>
      <button id="tabHistory" aria-current="false">History</button>
    </nav>
  </header>

  <!-- SETUP -->
  <section id="setup" class="card">
    <h2>New match</h2>
    <div class="group">
      <p>Difficulty</p>
      <div class="opts" id="diffOpts">
        <button class="opt" data-v="easy" aria-pressed="false">Easy</button>
        <button class="opt" data-v="medium" aria-pressed="true">Medium</button>
        <button class="opt" data-v="hard" aria-pressed="false">Hard</button>
      </div>
      <p class="hint" id="diffHint"></p>
    </div>
    <div class="group">
      <p>Number of rounds</p>
      <div class="opts" id="roundOpts">
        <button class="opt" data-v="3" aria-pressed="false">3</button>
        <button class="opt" data-v="5" aria-pressed="true">5</button>
        <button class="opt" data-v="10" aria-pressed="false">10</button>
      </div>
      <p class="hint">Draws still use up a round.</p>
    </div>
    <button class="btn" id="startBtn">Start match</button>
  </section>

  <!-- PLAY -->
  <section id="play" hidden>
    <div class="card">
      <div class="scoreboard" aria-label="Score">
        <div class="score you"><b id="sYou">0</b><span>You</span></div>
        <div class="score"><b id="sDraw">0</b><span>Draws</span></div>
        <div class="score cpu"><b id="sCpu">0</b><span>Computer</span></div>
      </div>
      <div class="roundline"><span id="roundLbl"></span><span id="diffLbl"></span></div>
      <div class="arena" aria-hidden="true">
        <div class="hand" id="handYou">❔</div>
        <div class="vs">vs</div>
        <div class="hand" id="handCpu">❔</div>
      </div>
      <div class="verdict" id="verdict" role="status" aria-live="polite">Pick your move</div>
      <div class="moves" id="moves">
        <button class="move" data-m="rock"><span class="e">✊</span>Rock</button>
        <button class="move" data-m="paper"><span class="e">✋</span>Paper</button>
        <button class="move" data-m="scissors"><span class="e">✌️</span>Scissors</button>
      </div>
    </div>
    <div class="card">
      <h2>This match</h2>
      <ul class="log" id="matchLog"><li class="empty" style="grid-template-columns:1fr">No rounds yet.</li></ul>
    </div>
    <button class="link" id="quitBtn">Quit match</button>
  </section>

  <!-- END -->
  <section id="end" class="card" hidden>
    <div class="big" id="endTitle"></div>
    <p class="final" id="endScore"></p>
    <button class="btn" id="replayBtn">Play again</button>
    <button class="btn alt" id="changeBtn">Change settings</button>
    <h2 style="margin-top:20px">Round by round</h2>
    <ul class="log" id="endLog"></ul>
  </section>

  <!-- HISTORY -->
  <section id="history" hidden>
    <div class="card">
      <h2>All-time record</h2>
      <div class="totals">
        <div><b id="tWins">0</b><span>Matches won</span></div>
        <div><b id="tLoss">0</b><span>Matches lost</span></div>
        <div><b id="tDraw">0</b><span>Matches drawn</span></div>
      </div>
      <h2>Past matches</h2>
      <ul class="log" id="histList"></ul>
      <button class="btn alt" id="clearBtn" style="margin-top:14px">Clear history</button>
    </div>
  </section>
</div>

<script>
(function(){
  const EMOJI = {rock:'✊', paper:'✋', scissors:'✌️'};
  const NAME  = {rock:'Rock', paper:'Paper', scissors:'Scissors'};
  const BEATS = {rock:'scissors', paper:'rock', scissors:'paper'};   // key beats value
  const COUNTER = {rock:'paper', paper:'scissors', scissors:'rock'}; // move that beats key
  const MOVES = ['rock','paper','scissors'];
  const HINTS = {
    easy:   'The computer picks at random.',
    medium: 'The computer sometimes counters the move you play most.',
    hard:   'The computer learns your patterns and plays against them.'
  };
  const STORE_KEY = 'rps-history-v1';
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const rand = arr => arr[Math.floor(Math.random()*arr.length)];

  let settings = {difficulty:'medium', rounds:5};
  let match = null;
  let busy = false;
  // AI memory (lasts while the page is open, so replays get harder to beat on Hard)
  let playerMoves = [];
  const trans = {};   // "a,b" -> {rock:n,paper:n,scissors:n}

  /* ---------- storage (falls back to memory if blocked) ---------- */
  let memHistory = [];
  function loadHistory(){
    try{ const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : []; }
    catch(e){ return memHistory; }
  }
  function saveHistory(list){
    memHistory = list;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){}
  }

  /* ---------- computer logic ---------- */
  function mostPlayed(){
    if(!playerMoves.length) return null;
    const c = {rock:0,paper:0,scissors:0};
    playerMoves.forEach(m => c[m]++);
    const max = Math.max(c.rock,c.paper,c.scissors);
    return rand(MOVES.filter(m => c[m]===max));
  }
  function predictNext(){
    if(playerMoves.length >= 2){
      const key = playerMoves.slice(-2).join(',');
      const t = trans[key];
      if(t){
        const max = Math.max(t.rock,t.paper,t.scissors);
        if(max > 0) return rand(MOVES.filter(m => t[m]===max));
      }
    }
    return mostPlayed();
  }
  function computerMove(){
    const d = settings.difficulty;
    if(d === 'easy') return rand(MOVES);
    if(d === 'medium'){
      const f = mostPlayed();
      return (f && Math.random() < 0.5) ? COUNTER[f] : rand(MOVES);
    }
    const p = predictNext();
    return (p && Math.random() < 0.85) ? COUNTER[p] : rand(MOVES);
  }
  function learn(move){
    if(playerMoves.length >= 2){
      const key = playerMoves.slice(-2).join(',');
      trans[key] = trans[key] || {rock:0,paper:0,scissors:0};
      trans[key][move]++;
    }
    playerMoves.push(move);
  }

  /* ---------- views ---------- */
  function show(name){
    ['setup','play','end','history'].forEach(v => $(v).hidden = (v !== name));
    const inHistory = name === 'history';
    $('tabPlay').setAttribute('aria-current', String(!inHistory));
    $('tabHistory').setAttribute('aria-current', String(inHistory));
  }
  let lastGameView = 'setup';
  function showGame(name){ lastGameView = name; show(name); }

  function pick(groupId, key, val){
    document.querySelectorAll('#'+groupId+' .opt').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.v === String(val)));
    });
    settings[key] = key === 'rounds' ? Number(val) : val;
    if(key === 'difficulty') $('diffHint').textContent = HINTS[val];
  }
  $('diffOpts').addEventListener('click', e => { const b = e.target.closest('.opt'); if(b) pick('diffOpts','difficulty',b.dataset.v); });
  $('roundOpts').addEventListener('click', e => { const b = e.target.closest('.opt'); if(b) pick('roundOpts','rounds',b.dataset.v); });
  $('diffHint').textContent = HINTS[settings.difficulty];

  /* ---------- match flow ---------- */
  function startMatch(){
    match = {round:0, you:0, cpu:0, draws:0, log:[], difficulty:settings.difficulty, rounds:settings.rounds};
    busy = false;
    $('handYou').textContent = '❔';
    $('handCpu').textContent = '❔';
    $('verdict').textContent = 'Pick your move';
    setMovesDisabled(false);
    renderScore();
    renderLog($('matchLog'));
    showGame('play');
  }
  function setMovesDisabled(v){ document.querySelectorAll('.move').forEach(b => b.disabled = v); }

  function renderScore(){
    $('sYou').textContent = match.you;
    $('sCpu').textContent = match.cpu;
    $('sDraw').textContent = match.draws;
    const shown = Math.min(match.round + 1, match.rounds);
    $('roundLbl').textContent = 'Round ' + shown + ' of ' + match.rounds;
    $('diffLbl').textContent = match.difficulty.charAt(0).toUpperCase() + match.difficulty.slice(1);
  }

  function renderLog(el){
    el.innerHTML = '';
    if(!match.log.length){
      el.innerHTML = '<li class="empty" style="grid-template-columns:1fr">No rounds yet.</li>';
      return;
    }
    match.log.forEach((r,i) => {
      const li = document.createElement('li');
      const label = r.result === 'win' ? 'Win' : r.result === 'lose' ? 'Loss' : 'Draw';
      li.innerHTML = '<span>R' + (i+1) + '</span><span>' + EMOJI[r.you] + ' ' + NAME[r.you] +
        ' vs ' + EMOJI[r.cpu] + ' ' + NAME[r.cpu] + '</span><span class="tag ' + r.result + '">' + label + '</span>';
      el.appendChild(li);
    });
  }

  function playRound(move){
    if(busy || !match || match.round >= match.rounds) return;
    busy = true;
    setMovesDisabled(true);
    const cpu = computerMove();
    learn(move);

    const hy = $('handYou'), hc = $('handCpu');
    hy.textContent = '✊'; hc.textContent = '✊';
    $('verdict').textContent = '…';
    if(!reduceMotion){ hy.classList.add('shake'); hc.classList.add('shake'); }

    setTimeout(() => {
      hy.classList.remove('shake'); hc.classList.remove('shake');
      hy.textContent = EMOJI[move]; hc.textContent = EMOJI[cpu];

      let result = 'draw';
      if(BEATS[move] === cpu) result = 'win';
      else if(BEATS[cpu] === move) result = 'lose';

      match.round++;
      if(result === 'win') match.you++;
      else if(result === 'lose') match.cpu++;
      else match.draws++;
      match.log.push({you:move, cpu:cpu, result:result});

      $('verdict').textContent =
        result === 'win'  ? NAME[move] + ' beats ' + NAME[cpu] + '. You win the round!' :
        result === 'lose' ? NAME[cpu] + ' beats ' + NAME[move] + '. Computer wins the round.' :
                            'Both chose ' + NAME[move] + '. Draw.';
      renderScore();
      renderLog($('matchLog'));

      if(match.round >= match.rounds){
        setTimeout(finishMatch, reduceMotion ? 700 : 1400);
      } else {
        busy = false;
        setMovesDisabled(false);
      }
    }, reduceMotion ? 150 : 550);
  }

  function finishMatch(){
    const outcome = match.you > match.cpu ? 'win' : match.you < match.cpu ? 'lose' : 'draw';
    $('endTitle').textContent =
      outcome === 'win' ? 'You win the match! 🎉' :
      outcome === 'lose' ? 'Computer wins the match' : 'The match is a draw';
    $('endScore').textContent =
      'You ' + match.you + ' – ' + match.cpu + ' Computer' + (match.draws ? '  (' + match.draws + ' draw' + (match.draws>1?'s':'') + ')' : '') +
      ' · ' + match.difficulty + ' · ' + match.rounds + ' rounds';
    renderLog($('endLog'));

    const list = loadHistory();
    list.unshift({
      when: new Date().toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}),
      difficulty: match.difficulty, rounds: match.rounds,
      you: match.you, cpu: match.cpu, draws: match.draws, outcome: outcome
    });
    saveHistory(list.slice(0, 50));
    busy = false;
    showGame('end');
  }

  /* ---------- history view ---------- */
  function renderHistory(){
    const list = loadHistory();
    $('tWins').textContent = list.filter(m => m.outcome === 'win').length;
    $('tLoss').textContent = list.filter(m => m.outcome === 'lose').length;
    $('tDraw').textContent = list.filter(m => m.outcome === 'draw').length;
    const ul = $('histList');
    ul.innerHTML = '';
    if(!list.length){
      ul.innerHTML = '<li class="empty" style="grid-template-columns:1fr">No matches yet. Finish a match and it will show up here.</li>';
      $('clearBtn').hidden = true;
      return;
    }
    $('clearBtn').hidden = false;
    list.forEach(m => {
      const li = document.createElement('li');
      li.style.gridTemplateColumns = '1fr auto';
      const label = m.outcome === 'win' ? 'Won' : m.outcome === 'lose' ? 'Lost' : 'Draw';
      li.innerHTML = '<div class="match"><div><b>' + m.you + ' – ' + m.cpu + '</b><small>' + m.when + ' · ' +
        m.difficulty + ' · ' + m.rounds + ' rounds</small></div></div><span class="tag ' + m.outcome + '">' + label + '</span>';
      ul.appendChild(li);
    });
  }

  /* ---------- events ---------- */
  $('startBtn').addEventListener('click', startMatch);
  $('moves').addEventListener('click', e => { const b = e.target.closest('.move'); if(b) playRound(b.dataset.m); });
  $('replayBtn').addEventListener('click', startMatch);
  $('changeBtn').addEventListener('click', () => showGame('setup'));
  $('quitBtn').addEventListener('click', () => { if(confirm('Quit this match? It will not be saved.')){ busy = false; showGame('setup'); } });
  $('tabPlay').addEventListener('click', () => show(lastGameView));
  $('tabHistory').addEventListener('click', () => { renderHistory(); show('history'); });
  $('clearBtn').addEventListener('click', () => {
    if(confirm('Delete all saved matches?')){ saveHistory([]); renderHistory(); }
  });
  document.addEventListener('keydown', e => {
    if($('play').hidden) return;
    const k = e.key.toLowerCase();
    if(k === 'r') playRound('rock');
    else if(k === 'p') playRound('paper');
    else if(k === 's') playRound('scissors');
  });
})();
</script>
</body>
</html>
